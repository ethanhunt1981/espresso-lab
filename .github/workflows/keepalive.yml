name: Supabase Keepalive

on:
  workflow_dispatch:

jobs:
  keepalive:
    runs-on: ubuntu-latest
    env:
      SUPA_KEY: sb_publishable_qvdROpWTP1yFBnKliRVrgw_ICjQJomE
    steps:
      - uses: actions/checkout@v4

      - name: Datenbank-Abfrage (Aktivität erzeugen)
        run: |
          echo "Abfrage an Supabase ..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: $SUPA_KEY" \
            -H "Authorization: Bearer $SUPA_KEY" \
            -H "Content-Type: application/json" \
            "https://aizvoccuyuzmnpedolbu.supabase.co/rest/v1/coffees?select=id")
          echo "HTTP Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Warnung: Abfrage nicht erfolgreich ($STATUS)"
            exit 1
          else
            echo "Abfrage erfolgreich."
          fi

      - name: Zufällige Wartezeit berechnen und GitHub API nutzen, um Workflow zu starten
        run: |
          DELAY=$((30 + RANDOM % 271))
          NEXT=$(date -u -d "now + ${DELAY} minutes" '+%Y-%m-%d %H:%M UTC' 2>/dev/null || date -d "+${DELAY} minutes" '+%Y-%m-%d %H:%M')
          echo "Nächster Lauf in $DELAY Minuten (ca. $NEXT)"
          echo "DELAY=$DELAY" >> $GITHUB_ENV

          echo "Warte $DELAY Minuten ..."
          sleep $((DELAY * 60))

          echo "Starte nächsten Workflow-Run ..."
          curl -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/keepalive.yml/dispatches" \
            -d '{"ref":"main","event_type":"workflow_dispatch"}'
